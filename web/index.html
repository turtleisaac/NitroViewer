<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>NitroViewer — Nintendo DS ROM Viewer &amp; Editor (in-browser Tinke alternative)</title>
    <meta
      name="description"
      content="NitroViewer is a modern, in-browser Nintendo DS ROM viewer and editor. Browse a ROM's filesystem and view &amp; edit NARC archives, NCGR/NCLR/NCER/NANR sprites, and NSBMD 3D models — a fast, free Tinke alternative that runs entirely in your browser."
    />
    <meta
      name="keywords"
      content="Nintendo DS, NDS ROM, ROM viewer, ROM editor, Tinke, Tinke alternative, NARC, NCGR, NCLR, NCER, NANR, NSBMD, NSBTX, sprite editor, DS romhacking, Pokémon romhacking"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0d0e12" />
    <link rel="canonical" href="https://nitroviewer.com/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:title" content="NitroViewer — Nintendo DS ROM Viewer &amp; Editor" />

    <meta property="og:image" content="https://nitroviewer.com/og.png" />
