name: Web e2e

# Phone layout against a synthetic ROM. Needs the CheerpJ jars, so this is separate from lint.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NitroViewer
        uses: actions/checkout@v4

      - name: Checkout Nds4j
        uses: actions/checkout@v4
        with:
          repository: turtleisaac/Nds4j
          ref: main
          path: Nds4j

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build jars
        env:
          NDS4J_DIR: ${{ github.workspace }}/Nds4j
        run: ./scripts/build-jars.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and run Playwright
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
