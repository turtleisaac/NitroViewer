name: Web e2e

# Phone layout against a synthetic ROM. Needs the CheerpJ jars, so this is separate from lint.
# A game DB json change, or a unit test with no app change, does not run Playwright.
on:
  pull_request:
    paths:
      - '.github/workflows/web-e2e.yml'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/playwright.config.ts'
      - 'web/vite.config.ts'
      - 'web/e2e/**'
      - 'web/src/**'
      - 'web/scripts/**'
      - 'web/index.html'
      - 'web/public/**'
      - 'nitroviewer-core/pom.xml'
      - 'nitroviewer-core/src/**'
      - 'scripts/build-jars.sh'
      - 'scripts/e2e-banner.mjs'
      - '!web/src/**/*.test.ts'
      - '!web/src/**/*.test.tsx'
      - '!web/src/gamedb/**/gamedb.json'
      - '!nitroviewer-core/**/gamedb.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NitroViewer
        uses: actions/checkout@v4

      - name: Checkout Nds4j
        uses: actions/checkout@v4
        with:
          repository: turtleisaac/Nds4j
          ref: main
          path: Nds4j

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build jars
        env:
          NDS4J_DIR: ${{ github.workspace }}/Nds4j
        run: ./scripts/build-jars.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and run Playwright
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
