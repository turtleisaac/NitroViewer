name: Game DB

# Shipped gamedb.json files. The default Vitest run does not include this check.
on:
  push:
    branches: ['**']
    paths:
      - "web/src/gamedb/**/gamedb.json"
      - "nitroviewer-core/src/main/resources/**/gamedb.json"
      - "web/src/gamedb/validity.test.ts"
      - "web/vitest.gamedb.config.ts"
  pull_request:
    paths:
      - "web/src/gamedb/**/gamedb.json"
      - "nitroviewer-core/src/main/resources/**/gamedb.json"
      - "web/src/gamedb/validity.test.ts"
      - "web/vitest.gamedb.config.ts"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate game DB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate
        working-directory: web
        run: |
          npm ci
          npm run test:gamedb
