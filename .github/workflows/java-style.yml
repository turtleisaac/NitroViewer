name: Java style

# The facade is not part of the Pages deploy. This is the check that a pull
# request's Java still matches the Eclipse profile and the newline/tab rules.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: Spotless and Checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check Java style
        # These goals do not compile and do not need the Nds4j jar.
        run: mvn -B -ntp -f nitroviewer-core/pom.xml spotless:check checkstyle:check
