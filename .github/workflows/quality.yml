name: Quality gates

# CRAP and dryer ratchet. Coverage is regenerated so a stale report cannot raise a score.
# Shipped gamedb.json does not change a score. A test fixture under src/test still does.
on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/quality.yml'
      - 'nitroviewer-core/pom.xml'
      - 'nitroviewer-core/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/vitest.config.ts'
      - 'web/vitest.coverage.config.ts'
      - 'web/src/**'
      - 'web/electron/**'
      - 'web/e2e/**'
      - 'scripts/quality/**'
      - '.quality/**'
      - '!web/src/gamedb/**/gamedb.json'
      - '!nitroviewer-core/src/main/resources/**/gamedb.json'
  pull_request:
    paths:
      - '.github/workflows/quality.yml'
      - 'nitroviewer-core/pom.xml'
      - 'nitroviewer-core/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/vitest.config.ts'
      - 'web/vitest.coverage.config.ts'
      - 'web/src/**'
      - 'web/electron/**'
      - 'web/e2e/**'
      - 'scripts/quality/**'
      - '.quality/**'
      - '!web/src/gamedb/**/gamedb.json'
      - '!nitroviewer-core/src/main/resources/**/gamedb.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crap-and-dry:
    name: CRAP and duplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: turtleisaac/Nds4j
          ref: main
          path: Nds4j

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Coverage, crapper, and dryer
        env:
          NDS4J_DIR: ${{ github.workspace }}/Nds4j
          QUALITY_BASE: origin/${{ github.base_ref || 'main' }}
        run: |
          scripts/quality/coverage.sh
          scripts/quality/check-quality.sh --base "$QUALITY_BASE"
